name: Build Pearl runner

on:
  workflow_dispatch:
    inputs:
      pearl_ref:
        description: "Pearl monorepo ref to build from (branch/tag/sha)"
        required: false
        default: "master"
      tag:
        description: "Image tag, e.g. v1"
        required: false
        default: "v1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Maximize build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Check out this repo (for the runner overlay)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out Pearl monorepo at ${{ github.event.inputs.pearl_ref }}
        uses: actions/checkout@v4
        with:
          repository: pearl-research-labs/pearl
          ref: ${{ github.event.inputs.pearl_ref }}
          submodules: recursive
          path: pearl

      - name: Stage runner overlay into Pearl source
        run: |
          mkdir -p pearl/runner
          cp overlay/runner/Dockerfile      pearl/runner/Dockerfile
          cp overlay/runner/entrypoint.sh   pearl/runner/entrypoint.sh
          cp overlay/runner/watchdog.sh     pearl/runner/watchdog.sh
          chmod +x pearl/runner/entrypoint.sh pearl/runner/watchdog.sh
          ls -la pearl/runner/

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pearl-runner
        uses: docker/build-push-action@v6
        with:
          context: pearl
          file: pearl/runner/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pearl-runner:${{ github.event.inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/pearl-runner:latest
          build-args: |
            PEARL_TAG=pearl-wallet-v1.0.0
            PEARL_BIN_VER=v1.0.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show final image
        run: |
          echo "Pushed: ghcr.io/${{ github.repository_owner }}/pearl-runner:${{ github.event.inputs.tag }}"
